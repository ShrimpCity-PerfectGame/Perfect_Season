[functions.submit-run]
enabled = true
# The platform's own verify_jwt gate runs before the function body and rejects the CORS preflight
# OPTIONS request outright (it never carries a JWT) - handling auth ourselves (authClient.auth.
# getUser(), already in index.ts) is the standard workaround so the preflight can still succeed.
verify_jwt = false
entrypoint = "./functions/submit-run/index.ts"

# Every other function needs exactly the same, for exactly the same reason: all five handle the preflight and
# check the caller's JWT themselves in their index.ts. Without a block here, only deploy-function.mjs's
# --no-verify-jwt flag keeps the preflight working, so a hand-run `npx supabase functions deploy <name>` ships
# it with the platform gate on and breaks CORS for every browser in a way nothing in this repo would catch.
# The flag is the belt and this file is the braces; three of the five had only the belt until v2.20.2.
# Keep the list in step with supabase/functions/ - deploy-function.mjs's FUNCTIONS is the other copy.
[functions.match-pick]
enabled = true
verify_jwt = false
entrypoint = "./functions/match-pick/index.ts"

[functions.submit-century]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-century/index.ts"

[functions.submit-guess]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-guess/index.ts"

[functions.delete-account]
enabled = true
verify_jwt = false
entrypoint = "./functions/delete-account/index.ts"
